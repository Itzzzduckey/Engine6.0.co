<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamTV - Pluto + Samsung + Roku</title>
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e94560; }
        .logo { font-size: 28px; font-weight: bold; color: #e94560; }
        .header-right { display: flex; gap: 20px; align-items: center; }
        .live-indicator { display: flex; align-items: center; gap: 8px; color: #ff4444; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-dot { width: 10px; height: 10px; background: #ff4444; border-radius: 50%; box-shadow: 0 0 10px #ff4444; }
        .clock { font-size: 18px; color: #a0a0a0; }
        .container { display: flex; height: calc(100vh - 70px); }
        .channel-sidebar { width: 340px; background: #141414; border-right: 1px solid #333; overflow-y: auto; padding: 10px; }
        .sidebar-header { padding: 15px; font-size: 14px; color: #888; text-transform: uppercase; border-bottom: 1px solid #333; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .refresh-btn { background: #e94560; border: none; color: #fff; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .channel-item { display: flex; align-items: center; padding: 10px 12px; margin: 4px 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .channel-item:hover { background: #1f1f1f; border-color: #e94560; }
        .channel-item.active { background: linear-gradient(90deg, #e94560 0%, #1f1f1f 100%); border-color: #e94560; }
        .channel-number { width: 32px; color: #666; font-weight: bold; font-size: 12px; }
        .channel-item.active .channel-number { color: #fff; }
        .channel-logo { width: 46px; height: 32px; background: #2a2a2a; border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-right: 10px; overflow: hidden; flex-shrink: 0; }
        .channel-logo img { width: 100%; height: 100%; object-fit: contain; }
        .channel-info { flex: 1; min-width: 0; }
        .channel-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-now { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item.active .channel-now { color: #ffd700; }
        .channel-status { width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; background: #00d084; box-shadow: 0 0 6px #00d084; flex-shrink: 0; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .player-section { background: #000; position: relative; }
        .video-container { aspect-ratio: 16/9; max-height: 48vh; background: #000; position: relative; }
        .video-js { width: 100%; height: 100%; }
        .vjs-big-play-button { background: rgba(233, 69, 96, 0.8) !important; border-color: #e94560 !important; }
        .channel-badge { position: absolute; top: 15px; left: 15px; background: rgba(233, 69, 96, 0.9); padding: 6px 14px; border-radius: 18px; font-weight: bold; font-size: 13px; z-index: 10; }
        .now-playing-bar { background: linear-gradient(90deg, #1a1a2e 0%, #16213e 100%); padding: 16px 25px; border-bottom: 1px solid #333; }
        .now-playing-title { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
        .now-playing-meta { display: flex; gap: 18px; color: #888; font-size: 13px; flex-wrap: wrap; }
        .progress-bar { width: 100%; height: 3px; background: #333; margin-top: 12px; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #e94560 0%, #ff6b6b 100%); width: 0%; transition: width 1s linear; }
        .category-tabs { display: flex; gap: 8px; padding: 12px 20px; background: #141414; border-bottom: 1px solid #333; overflow-x: auto; }
        .tab { padding: 7px 16px; border-radius: 18px; cursor: pointer; font-size: 12px; transition: all 0.2s; border: 1px solid transparent; white-space: nowrap; background: #1f1f1f; }
        .tab:hover { background: #2a2a2a; }
        .tab.active { background: #e94560; color: #fff; }
        .epg-section { flex: 1; overflow: auto; background: #0f0f0f; padding: 10px; }
        .status-msg { padding: 30px; text-align: center; color: #888; }
        .loading-spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid #333; border-top-color: #e94560; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e94560; }
        .error-msg { color: #ff4444; padding: 15px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📺 StreamTV</div>
        <div class="header-right">
            <div class="live-indicator"><span class="live-dot"></span>LIVE</div>
            <div class="clock" id="clock">--:--</div>
        </div>
    </div>

    <div class="container">
        <div class="channel-sidebar">
            <div class="sidebar-header">
                <span>Channels <span id="channelCount">(0)</span></span>
                <button class="refresh-btn" onclick="loadAllPlaylists()">↻ Load All</button>
            </div>
            <div id="channelList">
                <div class="status-msg">
                    <div class="loading-spinner"></div>
                    <div>Click <b>Load All</b> to fetch<br>Pluto + Samsung + Roku channels</div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="player-section">
                <div class="video-container">
                    <div class="channel-badge" id="channelBadge">Select a channel</div>
                    <video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto">
                        <p class="vjs-no-js">Enable JavaScript to watch</p>
                    </video>
                </div>
                <div class="now-playing-bar">
                    <div class="now-playing-title" id="nowPlayingTitle">Ready to Stream</div>
                    <div class="now-playing-meta" id="nowPlayingMeta">
                        <span>Load playlists to begin</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <div class="tab active" data-category="all">All</div>
            </div>

            <div class="epg-section">
                <div id="epgInfo" class="status-msg" style="padding-top:40px;">
                    Channels from Pluto TV, Samsung TV Plus & Roku Channel will appear here after loading.
                </div>
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script>
        // ===== PLAYLIST SOURCES =====
        const PLAYLISTS = [
            { name: "Pluto TV", url: "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_us.m3u" },
            { name: "Samsung TV Plus", url: "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_us.m3u" },
            { name: "Roku Channel", url: "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u" }
        ];

        let player;
        let channels = [];
        let currentChannel = null;
        let categories = new Set(["all"]);

        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('videoPlayer', {
                html5: { vhs: { overrideNative: true } },
                liveui: true,
                controls: true
            });
            updateClock();
            setInterval(updateClock, 1000);
        });

        async function loadAllPlaylists() {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = `<div class="status-msg"><div class="loading-spinner"></div>Loading Pluto + Samsung + Roku...</div>`;

            channels = [];
            categories = new Set(["all"]);
            let totalLoaded = 0;

            for (const pl of PLAYLISTS) {
                try {
                    // Using a public CORS proxy so the browser can fetch the raw GitHub files
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(pl.url)}`;
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const text = await res.text();
                    const parsed = parseM3U(text, pl.name);
                    channels = channels.concat(parsed);
                    totalLoaded += parsed.length;
                    console.log(`Loaded ${parsed.length} from ${pl.name}`);
                } catch (err) {
                    console.error(`Failed ${pl.name}:`, err);
                }
            }

            // Remove duplicates by URL
            const seen = new Set();
            channels = channels.filter(ch => {
                if (seen.has(ch.url)) return false;
                seen.add(ch.url);
                return true;
            });

            // Number them
            channels.forEach((ch, i) => ch.num = i + 1);

            document.getElementById('channelCount').textContent = `(${channels.length})`;
            renderCategoryTabs();
            renderChannelList();
            document.getElementById('epgInfo').innerHTML = `
                <div style="text-align:center;padding:30px;color:#aaa;">
                    <div style="font-size:18px;margin-bottom:10px;">✅ Loaded ${channels.length} free channels</div>
                    <div>Sources: Pluto TV • Samsung TV Plus • Roku Channel</div>
                    <div style="margin-top:15px;font-size:13px;color:#666;">Click any channel on the left to play</div>
                </div>`;

            if (channels.length > 0) {
                // Auto-select first channel
                selectChannel(channels[0].num);
            } else {
                listEl.innerHTML = `<div class="error-msg">Could not load any playlists.<br>Check console or try again later.</div>`;
            }
        }

        function parseM3U(text, source) {
            const lines = text.split(/\r?\n/);
            const result = [];
            let current = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    // Example: #EXTINF:-1 tvg-id="..." tvg-logo="..." group-title="News",Channel Name
                    const nameMatch = line.match(/,(.+)$/);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    const groupMatch = line.match(/group-title="([^"]+)"/i);

                    current = {
                        name: nameMatch ? nameMatch[1].trim() : "Unknown",
                        logo: logoMatch ? logoMatch[1] : "",
                        category: groupMatch ? groupMatch[1] : source,
                        source: source,
                        url: null
                    };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    if (current.url.includes('.m3u8') || current.url.includes('http')) {
                        result.push(current);
                        categories.add(current.category);
                    }
                    current = null;
                }
            }
            return result;
        }

        function renderCategoryTabs() {
            const tabs = ['<div class="tab active" data-category="all" onclick="filterChannels(\'all\')">All</div>'];
            [...categories].filter(c => c !== "all").sort().forEach(cat => {
                tabs.push(`<div class="tab" data-category="${cat}" onclick="filterChannels('${cat.replace(/'/g,"\\'")}')">${cat}</div>`);
            });
            document.getElementById('categoryTabs').innerHTML = tabs.join('');
        }

        function renderChannelList(filter = 'all') {
            const list = document.getElementById('channelList');
            const filtered = filter === 'all' ? channels : channels.filter(c => c.category === filter);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="status-msg">No channels in this category</div>`;
                return;
            }

            list.innerHTML = filtered.map(ch => `
                <div class="channel-item ${currentChannel && ch.num === currentChannel.num ? 'active' : ''}"
                     onclick="selectChannel(${ch.num})" id="channel-${ch.num}">
                    <div class="channel-number">${ch.num}</div>
                    <div class="channel-logo">
                        ${ch.logo ? `<img src="${ch.logo}" alt="" onerror="this.style.display='none'">` : ch.name.substring(0,2)}
                    </div>
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-now">${ch.source} • ${ch.category}</div>
                    </div>
                    <div class="channel-status"></div>
                </div>
            `).join('');
        }

        function selectChannel(num) {
            const channel = channels.find(c => c.num === num);
            if (!channel) return;

            currentChannel = channel;
            document.getElementById('channelBadge').textContent = `CH ${channel.num} • ${channel.name}`;
            document.getElementById('nowPlayingTitle').textContent = channel.name;
            document.getElementById('nowPlayingMeta').innerHTML = `
                <span>📺 ${channel.category}</span>
                <span>📡 ${channel.source}</span>
                <span>🔴 LIVE</span>
            `;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(`channel-${num}`);
            if (el) el.classList.add('active');

            // Play the stream
            try {
                player.src({ src: channel.url, type: 'application/x-mpegURL' });
                player.play().catch(e => console.warn("Play error:", e));
            } catch (e) {
                console.error("Player error:", e);
            }
        }

        function filterChannels(category) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tab = document.querySelector(`[data-category="${category}"]`);
            if (tab) tab.classList.add('active');
            renderChannelList(category);
        }

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {
                hour: 'numeric', minute: '2-digit', hour12: true
            });
        }
    </script>
</body>
</html>
