<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumpy Status</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
       
        :root {
            --purple: #7C3AED;
        }
       
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #F1E8FF 100%);
            color: #1E293B;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
       
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 40%, rgba(124, 58, 237, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 70%, rgba(167, 139, 250, 0.1) 0%, transparent 60%);
            animation: float 30s ease-in-out infinite;
        }
       
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 30px); }
        }
       
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--purple);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
       
        .status-card {
            background: white;
            border-radius: 32px;
            padding: 4rem 5rem;
            box-shadow: 0 20px 50px rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.15);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
       
        .maintenance-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #F59E0B;
            border-radius: 50%;
            animation: maintenance-pulse 2s infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
       
        @keyframes maintenance-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }
       
        .status-text {
            font-size: 4.5rem;
            font-weight: 700;
            color: #F59E0B;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
       
        .subtitle {
            font-size: 1.35rem;
            color: #64748B;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
       
        footer {
            margin-top: 4rem;
            color: #94A3B8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="background"></div>
   
    <div class="logo">Dumpy Status</div>
   
    <div class="status-card">
        <div>
            <span class="maintenance-dot"></span>
            <span style="font-size:1.1rem; font-weight:600; color:#F59E0B;">ALL SYSTEMS</span>
        </div>
       
        <div class="status-text">
            UNDER MAINTENANCE
        </div>
       
        <div class="subtitle">
            Dumpy is currently undergoing maintenance<br>
            <span id="last-updated" style="font-size:1rem;"></span>
        </div>
    </div>
   
    <footer>
        © Dumpy • We'll be back soon 💜
    </footer>
    <script>
        function updateTime() {
            const el = document.getElementById('last-updated');
            el.textContent = `Last checked • ${new Date().toLocaleTimeString()}`;
        }
       
        updateTime();
        setInterval(updateTime, 10000);
    </script>
</body>
</html>
