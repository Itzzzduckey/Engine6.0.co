<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Dumpy Cable - Ultimate Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: #111111;
      --border: #333333;
      --text: #ffffff;
      --text-dim: #888888;
      --accent: #00ff9d; /* Cyber Green */
      --live: #ff3333;
      --font-main: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 260px;
      background: #0a0a0a;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 10;
    }

    .logo {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { color: var(--accent); }

    .nav-item {
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-dim);
      font-weight: 600;
      transition: 0.2s;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-item:hover { background: #1a1a1a; color: var(--text); }
    .nav-item.active { background: rgba(0, 255, 157, 0.1); color: var(--accent); }

    /* --- MAIN CONTENT --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-bar {
      height: 70px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 30px;
      justify-content: space-between;
      background: rgba(5,5,5,0.95);
    }

    .search-container {
      position: relative;
      width: 400px;
    }
    .search-input {
      width: 100%;
      background: #111;
      border: 1px solid var(--border);
      padding: 12px 16px 12px 40px;
      border-radius: 8px;
      color: white;
      font-family: var(--font-main);
      transition: 0.3s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

    /* --- CHANNEL GRID --- */
    .channel-area {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .category-header {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .ch-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100px;
    }

    .ch-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px -10px rgba(0, 255, 157, 0.2);
    }

    .ch-logo {
      max-width: 80%;
      max-height: 50px;
      object-fit: contain;
      filter: grayscale(100%) brightness(0.7);
      transition: 0.3s;
    }
    .ch-card:hover .ch-logo { filter: grayscale(0%) brightness(1); }

    .ch-name {
      font-size: 0.8rem;
      margin-top: 10px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .ch-card:hover .ch-name { color: var(--text); }

    .live-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      background: var(--live);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--live);
    }

    /* --- PLAYER MODAL (Full Overlay) --- */
    .player-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: row;
    }
    .player-overlay.active { display: flex; }

    .video-section {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    .tuning-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    
    /* Static Noise Animation */
    .static-noise {
      position: absolute;
      inset: 0;
      opacity: 0.1;
      background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCI+CjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAiLz4KPGNpcmNsZSBjeD0iMjUiIGN5PSIyNSIgcj0iMSIgZmlsbD0iIzMzMyIvPgo8L3N2Zz4=');
      animation: noise 0.2s infinite;
    }
    @keyframes noise { 0% { transform: translate(0,0) } 10% { transform: translate(-5%,-5%) } 20% { transform: translate(-10%,5%) } 30% { transform: translate(5%,-10%) } 40% { transform: translate(-5%,15%) } 50% { transform: translate(-10%,5%) } 60% { transform: translate(15%,0) } 70% { transform: translate(0,10%) } 80% { transform: translate(-15%,0) } 90% { transform: translate(10%,5%) } 100% { transform: translate(5%,0) } }

    .info-sidebar {
      width: 350px;
      background: #0a0a0a;
      border-left: 1px solid var(--border);
      padding: 30px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--border);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: 0.2s;
    }
    .close-btn:hover { background: var(--live); border-color: var(--live); }

    .sidebar-logo { width: 60px; margin-bottom: 20px; }
    .sidebar-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; line-height: 1.2; }
    .sidebar-meta { color: var(--text-dim); font-family: var(--font-mono); font-size: 0.8rem; margin-bottom: 30px; display: flex; gap: 10px; }

    .now-playing-card {
      background: #111;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .np-label { font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); font-weight: 700; margin-bottom: 8px; }
    .np-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    .np-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 15px; }
    
    .progress-container { height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 1s linear; }

    .up-next { margin-top: 10px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 20px; }
    .up-next-title { color: var(--text); margin-top: 5px; font-size: 0.95rem; }

    /* Mobile */
    @media (max-width: 900px) {
      body { flex-direction: column; overflow: auto; }
      .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; border-right: none; border-bottom: 1px solid var(--border); }
      .nav-item { white-space: nowrap; margin: 0 5px; }
      .logo { display: none; }
      .player-overlay { flex-direction: column; }
      .info-sidebar { width: 100%; height: auto; max-height: 40vh; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo"><span>⚡</span> Dumpy Cable</div>
    <div class="nav-item active" onclick="filterCat('all')">All Channels</div>
    <div class="nav-item" onclick="filterCat('us')">🇺🇸 USA Premium</div>
    <div class="nav-item" onclick="filterCat('uk')">🇬🇧 UK Cable</div>
    <div class="nav-item" onclick="filterCat('sports')">⚽ Sports</div>
    <div class="nav-item" onclick="filterCat('news')">📰 News</div>
    <div class="nav-item" onclick="filterCat('movies')">🎬 Movies</div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Search channel (e.g. CNN, ESPN)...">
      </div>
    </header>

    <div class="channel-area">
      <div class="category-header">
        <span id="catTitle">All Channels</span>
        <span id="chanCount">Loading Database...</span>
      </div>
      <div class="grid" id="channelGrid">
        <!-- Channels injected here -->
      </div>
    </div>
  </main>

  <!-- Player Overlay -->
  <div id="playerOverlay" class="player-overlay">
    <div class="close-btn" onclick="closePlayer()">×</div>
    
    <!-- Video Section -->
    <div class="video-section">
      <div id="tuningScreen" class="tuning-overlay" style="display:none;">
        <div class="static-noise"></div>
        <div style="font-size: 3rem; margin-bottom: 20px;">📡</div>
        <div id="tuningText">TUNING SIGNAL...</div>
      </div>
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <!-- Info Sidebar -->
    <div class="info-sidebar">
      <img id="infoLogo" class="sidebar-logo" src="" alt="Logo">
      <div class="sidebar-title" id="infoName">Channel Name</div>
      <div class="sidebar-meta">
        <span id="infoCountry">US</span> • <span style="color:var(--accent)">HD</span> • <span>LIVE</span>
      </div>

      <div class="now-playing-card">
        <div class="np-label">NOW PLAYING</div>
        <div class="np-title" id="npTitle">Loading...</div>
        <div class="np-desc" id="npDesc">Program description loading...</div>
        <div class="progress-container">
          <div class="progress-bar" id="npProgress"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:0.7rem; color:var(--text-dim); font-family:var(--font-mono);">
          <span id="npStart">00:00</span>
          <span id="npEnd">00:00</span>
        </div>
      </div>

      <div class="up-next">
        <div>UP NEXT</div>
        <div class="up-next-title" id="nextTitle">...</div>
      </div>
    </div>
  </div>

<script>
  // --- 1. THE DATABASE (Optimized for Real Cable) ---
  // These IDs correspond to the highest quality verified channels in the IPTV Org database.
  const CABLE_DB = [
    // USA NEWS
    { id: 'cnn.us', name: 'CNN', country: 'US', cat: 'news' },
    { id: 'foxnews.us', name: 'Fox News', country: 'US', cat: 'news' },
    { id: 'msnbc.us', name: 'MSNBC', country: 'US', cat: 'news' },
    { id: 'bbcnews.uk', name: 'BBC News', country: 'UK', cat: 'news' },
    { id: 'cnbc.us', name: 'CNBC', country: 'US', cat: 'news' },
    { id: 'bloomberg.us', name: 'Bloomberg', country: 'US', cat: 'news' },
    
    // USA SPORTS
    { id: 'espn.us', name: 'ESPN', country: 'US', cat: 'sports' },
    { id: 'espn2.us', name: 'ESPN 2', country: 'US', cat: 'sports' },
    { id: 'foxsports.us', name: 'Fox Sports', country: 'US', cat: 'sports' },
    { id: 'skysportsmain.uk', name: 'Sky Sports Main', country: 'UK', cat: 'sports' },
    { id: 'skysportspremierleague.uk', name: 'Sky Sports PL', country: 'UK', cat: 'sports' },
    { id: 'beinsports.us', name: 'BeIN Sports', country: 'US', cat: 'sports' },
    { id: 'tnn.uk', name: 'True Crime', country: 'UK', cat: 'entertainment' },
    
    // USA MOVIES / ENTERTAINMENT (Premium)
    { id: 'tnt.us', name: 'TNT', country: 'US', cat: 'movies' },
    { id: 'tbs.us', name: 'TBS', country: 'US', cat: 'entertainment' },
    { id: 'fx.us', name: 'FX', country: 'US', cat: 'entertainment' },
    { id: 'amc.us', name: 'AMC', country: 'US', cat: 'movies' },
    { id: 'syfy.us', name: 'SYFY', country: 'US', cat: 'entertainment' },
    { id: 'comedycentral.us', name: 'Comedy Central', country: 'US', cat: 'entertainment' },
    { id: 'usa.us', name: 'USA Network', country: 'US', cat: 'entertainment' },
    { id: 'aetv.us', name: 'A&E', country: 'US', cat: 'entertainment' },
    { id: 'history.us', name: 'History', country: 'US', cat: 'documentary' },
    { id: 'discovery.us', name: 'Discovery', country: 'US', cat: 'documentary' },
    
    // PREMIUM (HBO/Showtime/Starz - Note: Some require specific region or might be geo-blocked, but IDs are correct)
    { id: 'hbo.us', name: 'HBO', country: 'US', cat: 'movies' },
    { id: 'hbobaseline.us', name: 'HBO Signature', country: 'US', cat: 'movies' },
    { id: 'showtime.us', name: 'Showtime', country: 'US', cat: 'movies' },
    { id: 'starz.us', name: 'Starz', country: 'US', cat: 'movies' },
    { id: 'cinemax.us', name: 'Cinemax', country: 'US', cat: 'movies' },
    
    // KIDS / MUSIC
    { id: 'cartoonnetwork.us', name: 'Cartoon Network', country: 'US', cat: 'kids' },
    { id: 'nickelodeon.us', name: 'Nickelodeon', country: 'US', cat: 'kids' },
    { id: 'disneychannel.us', name: 'Disney Channel', country: 'US', cat: 'kids' },
    { id: 'mtv.us', name: 'MTV', country: 'US', cat: 'music' },
    { id: 'vh1.us', name: 'VH1', country: 'US', cat: 'music' },

    // UK POPULAR
    { id: 'itv1.uk', name: 'ITV 1', country: 'UK', cat: 'entertainment' },
    { id: 'channel4.uk', name: 'Channel 4', country: 'UK', cat: 'entertainment' },
    { id: 'channel5.uk', name: 'Channel 5', country: 'UK', cat: 'entertainment' },
    { id: 'skyone.uk', name: 'Sky One', country: 'UK', cat: 'entertainment' },
    { id: 'skyatlantic.uk', name: 'Sky Atlantic', country: 'UK', cat: 'entertainment' },
  ];

  // State
  let displayedChannels = [...CABLE_DB];
  let hlsInstance = null;
  let guideInterval = null;

  // --- 2. INIT & RENDER ---
  const grid = document.getElementById('channelGrid');
  const searchInput = document.getElementById('searchInput');

  window.addEventListener('DOMContentLoaded', () => {
    renderGrid(displayedChannels);
    
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = CABLE_DB.filter(ch => ch.name.toLowerCase().includes(term));
      renderGrid(filtered);
    });
  });

  function renderGrid(channels) {
    grid.innerHTML = '';
    document.getElementById('chanCount').textContent = `${channels.length} Channels`;
    
    channels.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'ch-card';
      // Construct Logo URL using standard format: https://iptv-org.github.io/logos/channels/{country}/{id}.png
      const logoUrl = `https://iptv-org.github.io/logos/channels/${ch.country.toLowerCase()}/${ch.id}.png`;
      
      div.innerHTML = `
        <div class="live-dot"></div>
        <img src="${logoUrl}" class="ch-logo" onerror="this.src='https://via.placeholder.com/150/111/fff?text=${ch.name.substring(0,2)}'">
        <div class="ch-name">${ch.name}</div>
      `;
      div.onclick = () => openChannel(ch);
      grid.appendChild(div);
    });
  }

  function filterCat(cat) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    
    const title = event.target.textContent;
    document.getElementById('catTitle').textContent = title;

    if (cat === 'all') {
      renderGrid(CABLE_DB);
    } else {
      const filtered = CABLE_DB.filter(ch => ch.country === cat || ch.cat === cat);
      renderGrid(filtered);
    }
  }

  // --- 3. PLAYER LOGIC (Optimized APIs) ---
  async function openChannel(channel) {
    const overlay = document.getElementById('playerOverlay');
    const tuning = document.getElementById('tuningScreen');
    const tuningText = document.getElementById('tuningText');
    const video = document.getElementById('videoPlayer');

    overlay.classList.add('active');
    tuning.style.display = 'flex';
    tuningText.textContent = "TUNING SIGNAL...";
    video.style.opacity = 0;

    // Update Info Sidebar immediately
    document.getElementById('infoName').textContent = channel.name;
    document.getElementById('infoCountry').textContent = channel.country;
    document.getElementById('infoLogo').src = `https://iptv-org.github.io/logos/channels/${channel.country.toLowerCase()}/${channel.id}.png`;

    try {
      // API STRATEGY:
      // Fetch streams.json BUT filtered by channel_id server-side.
      // This avoids downloading the whole 20MB file.
      const streamRes = await fetch(`https://iptv-org.github.io/api/streams.json?channel_id=${channel.id}`);
      const streams = await streamRes.json();

      if (streams && streams.length > 0) {
        // Filter for HLS (m3u8) for best compatibility
        const validStreams = streams.filter(s => s.url.includes('.m3u8') && s.status === 'online');
        
        if (validStreams.length > 0) {
          // Pick the first one (Usually random, but fast)
          const streamUrl = validStreams[0].url;
          tuningText.textContent = "SIGNAL LOCKED";
          
          playVideo(streamUrl);
          fetchGuide(channel.id);
          
          setTimeout(() => {
            tuning.style.display = 'none';
            video.style.opacity = 1;
          }, 800);
        } else {
          throw new Error("No HLS streams available");
        }
      } else {
        throw new Error("Stream offline");
      }

    } catch (e) {
      console.error(e);
      tuningText.textContent = "SIGNAL LOST / OFFLINE";
      tuningText.style.color = "red";
    }
  }

  function playVideo(url) {
    const video = document.getElementById('videoPlayer');
    if (hlsInstance) { hlsInstance.destroy(); }

    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play();
    }
  }

  // --- 4. EPG (Guide) LOGIC ---
  async function fetchGuide(channelId) {
    try {
      // Fetch last 5 and next 5 programs
      const res = await fetch(`https://iptv-org.github.io/api/programs.json?channel_id=${channelId}&limit=10`);
      const programs = await res.json();
      updateGuideUI(programs);

      // Update Progress Bar every 30s
      if (guideInterval) clearInterval(guideInterval);
      guideInterval = setInterval(() => updateGuideUI(programs), 30000);
    } catch (e) {
      document.getElementById('npTitle').textContent = "Program Info Unavailable";
    }
  }

  function updateGuideUI(programs) {
    const now = new Date();
    const current = programs.find(p => new Date(p.start) <= now && new Date(p.stop) > now);
    const next = programs.find(p => new Date(p.start) > now);

    if (current) {
      document.getElementById('npTitle').textContent = current.title;
      document.getElementById('npDesc').textContent = current.description || "No description available.";
      
      const start = new Date(current.start);
      const stop = new Date(current.stop);
      document.getElementById('npStart').textContent = formatTime(start);
      document.getElementById('npEnd').textContent = formatTime(stop);

      // Calc Progress
      const total = stop - start;
      const elapsed = now - start;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
      document.getElementById('npProgress').style.width = `${pct}%`;
    }

    if (next) {
      document.getElementById('nextTitle').textContent = next.title;
    }
  }

  function formatTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function closePlayer() {
    document.getElementById('playerOverlay').classList.remove('active');
    document.getElementById('videoPlayer').pause();
    document.getElementById('videoPlayer').src = "";
    if (hlsInstance) hlsInstance.destroy();
    if (guideInterval) clearInterval(guideInterval);
  }

</script>
</body>
</html>
