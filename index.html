<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumpy Status</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        :root {
            --purple: #7C3AED;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #F1E8FF 100%);
            color: #1E2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 40%, rgba(124, 58, 237, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 70% 70%, rgba(167, 139, 250, 0.1) 0%, transparent 60%);
            animation: float 30s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 30px); }
        }
        
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--purple);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-card {
            background: white;
            border-radius: 32px;
            padding: 4rem 5rem;
            box-shadow: 0 20px 50px rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.15);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        
        .live-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #22C55E;
            border-radius: 50%;
            animation: live-pulse 2s infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        
        @keyframes live-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        
        .status-text {
            font-size: 4.5rem;
            font-weight: 700;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.4s ease;
        }
        
        .subtitle {
            font-size: 1.35rem;
            color: #64748B;
            margin-bottom: 2rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 2rem;
            text-align: left;
            font-size: 1.05rem;
        }
        
        .stat {
            background: #F8FAFC;
            padding: 0.75rem 1rem;
            border-radius: 12px;
        }
        
        footer {
            margin-top: 4rem;
            color: #94A3B8;
            font-size: 0.95rem;
        }

        .offline {
            color: #EF4444;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <div class="logo">Dumpy Status</div>
    
    <div class="status-card" id="status-card">
        <div id="live-indicator">
            <span class="live-dot" id="dot"></span>
            <span style="font-size:1.1rem; font-weight:600;" id="system-text">ALL SYSTEMS</span>
        </div>
        
        <div class="status-text" id="status-text">
            ONLINE
        </div>
        
        <div class="subtitle">
            Dumpy is running smoothly<br>
            <span id="last-updated" style="font-size:1rem;"></span>
        </div>

        <div class="stats-grid" id="stats-grid">
            <!-- Populated by JS -->
        </div>
    </div>
    
    <footer>
        © Dumpy • Always Watching 💜
    </footer>

    <script>
        let lastStatus = null;

        async function fetchStatus() {
            const el = document.getElementById('last-updated');
            const statusText = document.getElementById('status-text');
            const systemText = document.getElementById('system-text');
            const dot = document.getElementById('dot');
            const card = document.getElementById('status-card');
            const statsGrid = document.getElementById('stats-grid');

            try {
                const res = await fetch('/api/stats', { 
                    method: 'GET',
                    cache: 'no-cache'
                });

                if (!res.ok) throw new Error('Server error');

                const data = await res.json();

                // Update main status
                statusText.textContent = data.status === 'GREEN' ? 'ONLINE' : 
                                       data.status === 'YELLOW' ? 'DEGRADED' : 
                                       data.status === 'ORANGE' ? 'HEAVY LOAD' : 'CRITICAL';

                // Color logic
                if (data.status === 'GREEN') {
                    statusText.style.color = '#10B981';
                    dot.style.background = '#22C55E';
                    systemText.style.color = '#10B981';
                    card.style.borderColor = 'rgba(16, 185, 129, 0.2)';
                } else if (data.status === 'YELLOW') {
                    statusText.style.color = '#EAB308';
                    dot.style.background = '#EAB308';
                    systemText.style.color = '#EAB308';
                } else if (data.status === 'ORANGE') {
                    statusText.style.color = '#F97316';
                    dot.style.background = '#F97316';
                    systemText.style.color = '#F97316';
                } else {
                    statusText.style.color = '#EF4444';
                    dot.style.background = '#EF4444';
                    systemText.style.color = '#EF4444';
                    statusText.classList.add('offline');
                }

                systemText.textContent = data.status === 'GREEN' ? 'ALL SYSTEMS' : 'SYSTEMS UNDER LOAD';

                // Update live stats
                statsGrid.innerHTML = `
                    <div class="stat"><strong>Online Now</strong><br>${data.online}</div>
                    <div class="stat"><strong>Requests/min</strong><br>${data.reqPerMin}</div>
                    <div class="stat"><strong>CPU Load</strong><br>${data.loadPct}%</div>
                    <div class="stat"><strong>Memory</strong><br>${data.memMB}/${data.totalMemMB} MB</div>
                `;

                lastStatus = data;

            } catch (e) {
                // Offline state
                statusText.textContent = 'OFFLINE';
                statusText.style.color = '#EF4444';
                dot.style.background = '#EF4444';
                systemText.style.color = '#EF4444';
                systemText.textContent = 'SERVER UNREACHABLE';
                
                statsGrid.innerHTML = `<div class="stat" style="grid-column: span 2; color:#EF4444;">Could not connect to Dumpy server</div>`;
            }

            el.textContent = `Last checked • ${new Date().toLocaleTimeString()}`;
        }

        // Initial fetch + polling
        fetchStatus();
        setInterval(fetchStatus, 8000); // every 8 seconds

        // Also update clock more frequently
        setInterval(() => {
            if (lastStatus) {
                document.getElementById('last-updated').textContent = 
                    `Last checked • ${new Date().toLocaleTimeString()}`;
            }
        }, 1000);
    </script>
</body>
</html>
