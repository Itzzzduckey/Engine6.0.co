    async function fetchStatus() {
        const statusText = document.getElementById('status-text');
        const lastUpdated = document.getElementById('last-updated');

        console.log("🔍 Fetching /api/stats...");

        try {
            const res = await fetch('/api/stats', {
                headers: { 'x-api-key': API_KEY }
            });

            console.log("📡 Response status:", res.status);

            if (res.status === 401) {
                statusText.textContent = "UNAUTHORIZED";
                statusText.style.color = "#EF4444";
                console.error("❌ API Key rejected by server");
                return;
            }

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = await res.json();
            console.log("✅ Stats received:", data);

            // Update UI
            const isHealthy = data.status === 'GREEN';
            statusText.textContent = isHealthy ? 'ONLINE' : data.status;
            statusText.style.color = isHealthy ? '#10B981' : '#F97316';

            document.getElementById('dot').style.background = statusText.style.color;
            document.getElementById('system-text').textContent = isHealthy ? 'ALL SYSTEMS' : 'SYSTEMS UNDER LOAD';

        } catch (err) {
            console.error("❌ Fetch failed:", err);
            statusText.textContent = 'OFFLINE';
            statusText.style.color = '#EF4444';
        }

        lastUpdated.textContent = `Last checked • ${new Date().toLocaleTimeString()}`;
    }

    fetchStatus();
    setInterval(fetchStatus, 5000);
</script>
